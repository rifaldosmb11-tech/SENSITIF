<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phoenix Cyber Vault Pro — Premium Edition (Storage Fixed)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@400;500;600;700&family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-primary:#030508; --bg-secondary:#0a0d18; --card-bg:rgba(14,19,34,0.72);
  --accent-cyan:#00f0ff; --accent-purple:#7000ff; --accent-pink:#ff0055; --accent-gold:#ffd27a;
  --text-main:#e2e8f0; --text-muted:#8a99ad;
  --border-neon:rgba(0,240,255,0.3);
  --glass-blur:blur(18px);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Rajdhani',sans-serif}
body{background:var(--bg-primary);color:var(--text-main);min-height:100vh;overflow-x:hidden;position:relative}

/* Aurora background */
#aurora{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.aurora-blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;mix-blend-mode:screen;animation:floatBlob 18s ease-in-out infinite}
.aurora-blob.a{width:520px;height:520px;background:radial-gradient(circle,#7000ff,transparent 60%);top:-120px;left:-100px}
.aurora-blob.b{width:600px;height:600px;background:radial-gradient(circle,#00f0ff,transparent 60%);bottom:-160px;right:-120px;animation-delay:-6s}
.aurora-blob.c{width:420px;height:420px;background:radial-gradient(circle,#ff0055,transparent 60%);top:40%;left:50%;animation-delay:-12s}
@keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.1)}66%{transform:translate(-40px,50px) scale(.95)}}
#spaceCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg-secondary)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--accent-cyan),var(--accent-purple));border-radius:4px}

/* LOCK SCREEN */
#lockScreen{position:fixed;inset:0;background:rgba(3,5,8,0.88);backdrop-filter:blur(22px);z-index:10000;display:flex;justify-content:center;align-items:center;flex-direction:column;transition:opacity .5s ease}
.lock-card{background:var(--card-bg);backdrop-filter:var(--glass-blur);border:1px solid rgba(0,240,255,0.35);box-shadow:0 0 40px rgba(0,240,255,.25),inset 0 1px 1px rgba(255,255,255,.08);padding:40px 36px;border-radius:20px;text-align:center;max-width:410px;width:90%;position:relative;animation:cardIn .6s cubic-bezier(.16,1,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
.shield-ring{position:relative;width:96px;height:96px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.shield-ring::before,.shield-ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent-cyan);opacity:.5}
.shield-ring::before{animation:ringPulse 2.4s ease-out infinite}
.shield-ring::after{animation:ringPulse 2.4s ease-out infinite .8s}
@keyframes ringPulse{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.shield-core{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,rgba(0,240,255,.25),rgba(14,19,34,.9));display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:var(--accent-cyan);box-shadow:0 0 30px rgba(0,240,255,.5),inset 0 0 20px rgba(0,240,255,.2);animation:coreGlow 3s ease-in-out infinite}
@keyframes coreGlow{0%,100%{box-shadow:0 0 25px rgba(0,240,255,.4),inset 0 0 18px rgba(0,240,255,.15)}50%{box-shadow:0 0 45px rgba(0,240,255,.7),inset 0 0 26px rgba(0,240,255,.3)}}
.lock-title{font-family:'Orbitron',sans-serif;color:var(--accent-cyan);margin-bottom:10px;letter-spacing:3px;font-weight:800;background:linear-gradient(90deg,#00f0ff,#7000ff,#00f0ff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shineText 4s linear infinite}
@keyframes shineText{to{background-position:200% center}}
.lock-sub{color:var(--text-muted);font-size:.9rem;margin-bottom:6px}
.mode-tabs{display:flex;gap:6px;margin:16px 0 10px;flex-wrap:wrap;justify-content:center}
.mode-tab{background:rgba(255,255,255,.04);border:1px solid var(--border-neon);color:var(--text-muted);padding:7px 14px;border-radius:10px;cursor:pointer;font-size:.8rem;font-weight:600;transition:.25s}
.mode-tab:hover{color:var(--accent-cyan);border-color:var(--accent-cyan)}
.mode-tab.active{background:linear-gradient(135deg,var(--accent-cyan),var(--accent-purple));color:#fff;border-color:transparent;box-shadow:0 0 14px rgba(0,240,255,.5)}
.pin-dots{display:flex;justify-content:center;gap:16px;margin:18px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-cyan);transition:.25s cubic-bezier(.34,1.56,.64,1)}
.pin-dot.filled{background:var(--accent-cyan);box-shadow:0 0 14px var(--accent-cyan);transform:scale(1.15)}
#pinError{color:var(--accent-pink);font-size:.85rem;min-height:20px;transition:.2s}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.num-btn{position:relative;background:rgba(255,255,255,.04);border:1px solid var(--border-neon);color:var(--text-main);padding:15px;font-size:1.25rem;border-radius:12px;cursor:pointer;transition:.2s;font-weight:600;display:flex;align-items:center;justify-content:center;overflow:hidden}
.num-btn::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,rgba(0,240,255,.4),transparent 70%);opacity:0;transition:opacity .4s}
.num-btn:active::after{opacity:1;transition:0s}
.num-btn:hover{background:rgba(0,240,255,.12);color:var(--accent-cyan);box-shadow:0 0 16px rgba(0,240,255,.4);transform:translateY(-2px);border-color:var(--accent-cyan)}
.sync-input{width:100%;background:rgba(5,8,15,.7);border:1px solid var(--border-neon);padding:12px;border-radius:10px;color:#fff;outline:none;text-align:center;letter-spacing:1px;font-size:.9rem;margin:8px 0;transition:.25s}
.sync-input:focus{border-color:var(--accent-cyan);box-shadow:0 0 14px rgba(0,240,255,.45)}
.lock-hint{color:var(--text-muted);font-size:.76rem;margin-top:14px;line-height:1.6}
.lock-hint strong{color:var(--accent-cyan)}

/* LAYOUT */
.container{max-width:1120px;margin:0 auto;padding:20px;position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--border-neon);margin-bottom:30px;flex-wrap:wrap;gap:12px}
.logo{font-family:'Orbitron',sans-serif;font-size:1.7rem;text-transform:uppercase;letter-spacing:2px;display:flex;align-items:center;gap:12px;font-weight:800}
.logo i{color:var(--accent-cyan);animation:boltPulse 2.5s ease-in-out infinite;filter:drop-shadow(0 0 8px var(--accent-cyan))}
@keyframes boltPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px var(--accent-cyan))}50%{transform:scale(1.12);filter:drop-shadow(0 0 14px var(--accent-cyan))}}
.logo-text{background:linear-gradient(90deg,#00f0ff,#fff,#7000ff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shineText 5s linear infinite}
.header-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sync-status{padding:6px 12px;border-radius:20px;font-size:.82rem;display:flex;align-items:center;gap:6px;transition:.3s}
.sync-status.online{background:rgba(0,255,136,.1);color:#00ff88;border:1px solid #00ff88;box-shadow:0 0 10px rgba(0,255,136,.2)}
.sync-status.online i{animation:dotPulse 2s infinite}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.4}}
.sync-status.offline{background:rgba(255,0,85,.1);color:var(--accent-pink);border:1px solid var(--accent-pink)}
.sync-status.syncing{background:rgba(0,240,255,.1);color:var(--accent-cyan);border:1px solid var(--accent-cyan)}
.sync-status.syncing i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{position:relative;background:rgba(0,240,255,.08);border:1px solid var(--accent-cyan);color:var(--accent-cyan);padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600;transition:.3s;display:inline-flex;align-items:center;gap:8px;overflow:hidden}
.btn::before{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,.35),transparent);transition:left .6s}
.btn:hover::before{left:120%}
.btn:hover{background:var(--accent-cyan);color:#000;box-shadow:0 0 18px var(--accent-cyan);transform:translateY(-1px)}
.btn-danger{border-color:var(--accent-pink);color:var(--accent-pink);background:rgba(255,0,85,.08)}
.btn-danger:hover{background:var(--accent-pink);color:#fff;box-shadow:0 0 18px var(--accent-pink)}
.session-timer{font-size:.8rem;color:var(--text-muted);padding:4px 10px;border:1px solid var(--border-neon);border-radius:12px;display:inline-flex;align-items:center;gap:6px}
.timer-ring{position:relative;width:18px;height:18px}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:2.5}
.timer-ring .bg{stroke:rgba(0,240,255,.15)}
.timer-ring .fg{stroke:var(--accent-cyan);stroke-linecap:round;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 3px var(--accent-cyan))}
.vault-id-chip{font-size:.75rem;color:var(--text-muted);padding:5px 12px;border:1px dashed var(--border-neon);border-radius:12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:.25s}
.vault-id-chip:hover{color:var(--accent-cyan);border-color:var(--accent-cyan);box-shadow:0 0 10px rgba(0,240,255,.3)}

.dashboard-grid{display:grid;grid-template-columns:340px 1fr;gap:26px}
@media(max-width:850px){.dashboard-grid{grid-template-columns:1fr}}

@property --gradient-angle{syntax:"<angle>";initial-value:0deg;inherits:false}
.card-wrapper{position:relative;border-radius:18px;padding:2px;background:conic-gradient(from var(--gradient-angle),#ff0055 0deg,#7000ff 90deg,#00f0ff 180deg,#ffffff 220deg,#00f0ff 240deg,#ff0055 360deg);animation:rotateLightning 4s linear infinite}
.card-wrapper::before{content:"";position:absolute;inset:-2px;border-radius:20px;background:inherit;filter:blur(12px);opacity:.6;z-index:-1;animation:pulseLightning 2s ease-in-out infinite alternate}
@keyframes rotateLightning{0%{--gradient-angle:0deg}100%{--gradient-angle:360deg}}
@keyframes pulseLightning{0%{opacity:.35;filter:blur(10px)}100%{opacity:.8;filter:blur(16px)}}
.card{background:var(--card-bg);backdrop-filter:var(--glass-blur);border-radius:16px;padding:24px;height:100%;position:relative;z-index:1;box-shadow:inset 0 0 25px rgba(0,0,0,.5)}
.card-title{font-family:'Orbitron',sans-serif;font-size:1.05rem;color:var(--accent-cyan);margin-bottom:22px;display:flex;align-items:center;gap:10px;letter-spacing:1px}
.card-title i{filter:drop-shadow(0 0 6px var(--accent-cyan))}

.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;color:var(--text-muted);font-size:.9rem;font-weight:500}
.form-control{width:100%;background:rgba(5,8,15,.7);border:1px solid var(--border-neon);padding:12px 14px;border-radius:10px;color:#fff;outline:none;transition:.3s;font-size:1rem}
.form-control:focus{border-color:var(--accent-cyan);box-shadow:0 0 14px rgba(0,240,255,.45);background:rgba(5,8,15,.9)}
.input-group{position:relative}
.input-btn-inside{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--accent-cyan);cursor:pointer;padding:5px;display:flex;align-items:center;justify-content:center;transition:.2s}
.input-btn-inside:hover{filter:drop-shadow(0 0 6px var(--accent-cyan))}
.password-strength{margin-top:6px;height:5px;border-radius:3px;background:var(--bg-secondary);overflow:hidden;position:relative}
.password-strength-bar{height:100%;width:0%;transition:width .4s,background-color .3s;border-radius:3px;position:relative}
.password-strength-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shimmer 1.6s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

.search-bar{margin-bottom:20px}
.credential-list{display:flex;flex-direction:column;gap:12px;max-height:520px;overflow-y:auto;padding:4px}
.credential-item{display:grid;grid-template-columns:1.5fr 2fr 1.5fr auto;align-items:center;padding:16px 18px;gap:12px;background:linear-gradient(145deg,rgba(20,28,46,.9) 0%,rgba(15,22,36,.9) 100%);border:1px solid rgba(0,240,255,.2);border-left:4px solid var(--accent-cyan);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.08);transition:transform .3s cubic-bezier(.175,.885,.32,1.275),box-shadow .3s ease,border-color .3s ease;position:relative;z-index:2;animation:itemIn .5s cubic-bezier(.16,1,.3,1) both}
@keyframes itemIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@media(max-width:650px){.credential-item{grid-template-columns:1fr;gap:10px}}
.credential-item:hover{transform:translateY(-4px) scale(1.015);border-color:rgba(0,240,255,.6);border-left-color:var(--accent-pink);box-shadow:0 14px 28px rgba(0,0,0,.7),0 0 20px rgba(0,240,255,.25),inset 0 1px 2px rgba(255,255,255,.15)}
.platform-col{display:flex;align-items:center;gap:12px;font-weight:600}
.platform-icon-wrapper{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,rgba(0,240,255,.18),rgba(112,0,255,.28));border:1px solid var(--accent-cyan);display:flex;align-items:center;justify-content:center;color:var(--accent-cyan);box-shadow:0 0 12px rgba(0,240,255,.3),inset 0 1px 1px rgba(255,255,255,.3);transition:.3s}
.credential-item:hover .platform-icon-wrapper{transform:rotate(-6deg) scale(1.08);box-shadow:0 0 18px rgba(0,240,255,.5)}
.user-col{color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.pass-col{font-family:'Sora',monospace;letter-spacing:2px;color:var(--accent-cyan);font-weight:600}
.action-col{display:flex;gap:6px}
.action-btn{background:linear-gradient(145deg,#182238,#0d1424);border:1px solid rgba(0,240,255,.3);color:var(--text-main);width:34px;height:34px;border-radius:9px;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.15)}
.action-btn:hover{background:var(--accent-cyan);color:#030508;box-shadow:0 0 14px var(--accent-cyan);transform:translateY(-2px)}
.action-btn.del:hover{background:var(--accent-pink);border-color:var(--accent-pink);color:#fff;box-shadow:0 0 14px var(--accent-pink)}

#toast{position:fixed;bottom:24px;right:24px;background:var(--card-bg);backdrop-filter:var(--glass-blur);border:1px solid var(--accent-cyan);padding:15px 20px;border-radius:12px;box-shadow:0 0 26px rgba(0,240,255,.35);display:flex;align-items:center;gap:12px;transform:translateY(120px);opacity:0;transition:.4s cubic-bezier(.175,.885,.32,1.275);z-index:1000;max-width:400px}
#toast.show{transform:translateY(0);opacity:1}
.empty-state{text-align:center;color:var(--text-muted);padding:40px 20px}
.empty-state i{font-size:2.5rem;color:rgba(0,240,255,.3);margin-bottom:12px;display:block}
</style>
</head>
<body>
<div id="aurora"><div class="aurora-blob a"></div><div class="aurora-blob b"></div><div class="aurora-blob c"></div></div>
<canvas id="spaceCanvas"></canvas>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <div class="lock-card">
    <div class="shield-ring"><div class="shield-core"><i class="fas fa-shield-halved"></i></div></div>
    <h2 class="lock-title" id="lockTitle">VAULT TERKUNCI</h2>
    <p class="lock-sub" id="lockSub">Masukkan PIN Keamanan</p>
    <div class="mode-tabs" id="modeTabs">
      <div class="mode-tab active" data-mode="unlock">Buka Vault</div>
      <div class="mode-tab" data-mode="create">Vault Baru</div>
      <div class="mode-tab" data-mode="sync">Sync Perangkat</div>
    </div>
    <div id="syncBox" style="display:none"><input type="text" id="syncIdInput" class="sync-input" placeholder="Tempel Vault ID dari perangkat lain"></div>
    <div class="pin-dots"><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div></div>
    <div id="pinError"></div>
    <div class="numpad">
      <button class="num-btn" onclick="pressPin('1')">1</button><button class="num-btn" onclick="pressPin('2')">2</button><button class="num-btn" onclick="pressPin('3')">3</button>
      <button class="num-btn" onclick="pressPin('4')">4</button><button class="num-btn" onclick="pressPin('5')">5</button><button class="num-btn" onclick="pressPin('6')">6</button>
      <button class="num-btn" onclick="pressPin('7')">7</button><button class="num-btn" onclick="pressPin('8')">8</button><button class="num-btn" onclick="pressPin('9')">9</button>
      <button class="num-btn" onclick="clearPin()"><i class="fas fa-undo"></i></button><button class="num-btn" onclick="pressPin('0')">0</button><button class="num-btn" onclick="checkPin()"><i class="fas fa-arrow-right"></i></button>
    </div>
    <div class="lock-hint" id="lockHint"></div>
  </div>
</div>

<!-- MAIN -->
<div class="container">
  <header>
    <div class="logo"><i class="fas fa-bolt"></i><span class="logo-text">Phoenix Cyber Vault</span></div>
    <div class="header-actions">
      <div id="syncStatus" class="sync-status online"><i class="fas fa-wifi"></i> <span id="syncText">Online</span></div>
      <span class="vault-id-chip" id="vaultIdChip" title="Klik untuk salin Vault ID"><i class="fas fa-cloud"></i> <span id="vaultIdText">—</span></span>
      <span class="session-timer"><span class="timer-ring"><svg width="18" height="18" viewBox="0 0 18 18"><circle class="bg" cx="9" cy="9" r="7"/><circle class="fg" id="timerRing" cx="9" cy="9" r="7" stroke-dasharray="44" stroke-dashoffset="0"/></svg></span> <span id="timerDisplay">5:00</span></span>
      <button class="btn" onclick="lockVault()"><i class="fas fa-lock"></i> Kunci</button>
    </div>
  </header>
  <div class="dashboard-grid">
    <div class="card-wrapper"><div class="card">
      <h3 class="card-title"><i class="fas fa-plus-circle"></i> Tambah Kredensial</h3>
      <form id="vaultForm">
        <div class="form-group"><label>Platform / Layanan</label><input type="text" id="platformInput" class="form-control" placeholder="cth: Google, Steam" required minlength="2"></div>
        <div class="form-group"><label>Username / Email</label><input type="text" id="userInput" class="form-control" placeholder="user@domain.com" required minlength="3"></div>
        <div class="form-group"><label>Password</label>
          <div class="input-group">
            <input type="password" id="passInput" class="form-control" style="padding-right:76px" placeholder="••••••••" required minlength="8" oninput="checkPasswordStrength(this.value)">
            <button type="button" class="input-btn-inside" style="right:40px" onclick="generatePassword()" title="Generate Password"><i class="fas fa-dice"></i></button>
            <button type="button" class="input-btn-inside" onclick="toggleGenEye()" title="Lihat/Sembunyikan"><i class="fas fa-eye" id="genEye"></i></button>
          </div>
          <div class="password-strength"><div class="password-strength-bar" id="strengthBar"></div></div>
          <div id="strengthText" style="font-size:.8rem;color:var(--text-muted);margin-top:5px"></div>
        </div>
        <button type="submit" class="btn" style="width:100%;justify-content:center;margin-top:12px"><i class="fas fa-save"></i> Simpan Ke Vault</button>
      </form>
      <hr style="border:none;border-top:1px solid var(--border-neon);margin:26px 0">
      <h3 class="card-title" style="font-size:.95rem"><i class="fas fa-database"></i> Manajemen Data</h3>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn" onclick="syncNow()"><i class="fas fa-sync-alt"></i> Sync Sekarang</button>
        <button class="btn" onclick="exportData()"><i class="fas fa-download"></i> Backup Data (JSON)</button>
        <button class="btn" onclick="importData()"><i class="fas fa-upload"></i> Restore Data</button>
        <input type="file" id="fileInput" style="display:none" onchange="handleImport(event)">
        <button class="btn" onclick="changePin()"><i class="fas fa-key"></i> Ganti PIN</button>
        <button class="btn btn-danger" onclick="clearAllData()"><i class="fas fa-trash-alt"></i> Kosongkan Vault</button>
      </div>
    </div></div>
    <div class="card-wrapper"><div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h3 class="card-title" style="margin-bottom:0"><i class="fas fa-vault"></i> Terpenjara Data (<span id="totalCount">0</span>)</h3>
      </div>
      <div class="search-bar"><input type="text" id="searchInput" class="form-control" placeholder="Cari platform atau username..." oninput="filterCredentials()"></div>
      <div class="credential-list" id="credentialList"></div>
    </div></div>
  </div>
</div>

<div id="toast"><i class="fas fa-check-circle" id="toastIcon" style="color:var(--accent-cyan);font-size:1.2rem"></i><div><div id="toastTitle" style="font-weight:600">Notifikasi</div><div id="toastMessage" style="font-size:.85rem;color:var(--text-muted)">Pesan</div></div></div>

<script>
/* ============ AUDIO ============ */
function playUnlockSound(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; const ctx=new AC();
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine'; o.frequency.setValueAtTime(f,ctx.currentTime+i*.06);
      g.gain.setValueAtTime(0,ctx.currentTime+i*.06);
      g.gain.linearRampToValueAtTime(.15,ctx.currentTime+i*.06+.02);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.06+.25);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+i*.06); o.stop(ctx.currentTime+i*.06+.25);
    });
  }catch(e){}
}
/* ============ CRYPTO ============ */
const SALT='PhoenixVaultSalt2026', VERIFIER='PHOENIX_VERIFIER_2026';
const cryptoMgr={key:null,
  async deriveKey(pin){const enc=new TextEncoder();const km=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);cryptoMgr.key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode(SALT),iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);},
  async encrypt(text){const enc=new TextEncoder();const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoMgr.key,enc.encode(text));const c=new Uint8Array(iv.length+ct.byteLength);c.set(iv);c.set(new Uint8Array(ct),iv.length);return btoa(String.fromCharCode(...c));},
  async decrypt(b64){const c=Uint8Array.from(atob(b64),x=>x.charCodeAt(0));const iv=c.slice(0,12),d=c.slice(12);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},cryptoMgr.key,d);return new TextDecoder().decode(pt);},
  async pack(creds){return await this.encrypt(JSON.stringify({verifier:VERIFIER,credentials:creds}));},
  async unpack(blob){const j=await this.decrypt(blob);const o=JSON.parse(j);if(o.verifier!==VERIFIER)throw new Error('PIN salah');return o.credentials;}
};
/* ============ CLOUD ============ */
const API='https://jsonblob.com/api/jsonBlob', ID_KEY='phoenix_vault_id', CACHE_KEY='phoenix_vault_cache';
let vaultId=localStorage.getItem(ID_KEY)||null, credentials=[], isUnlocked=false, sessionTimer=null, sessionTime=300, isLocking=false, visiblePasswords={}, lockMode='unlock', pendingPin='', confirmPin=null;
function setSyncStatus(s,t){const el=document.getElementById('syncStatus'),tx=document.getElementById('syncText');el.className='sync-status '+s;tx.textContent=t;}
function updateNetworkStatus(){if(!navigator.onLine){setSyncStatus('offline','Offline');return;}setSyncStatus('online',vaultId?'Tersinkron':'Online');}
async function cloudCreate(blob){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({data:blob})});if(!r.ok)throw new Error('Gagal upload');const loc=r.headers.get('Location')||r.headers.get('location');if(!loc){const j=await r.json().catch(()=>null);if(j&&j.id)return j.id;throw new Error('Gagal mendapat Vault ID');}return loc.split('/').pop();}
async function cloudGet(id){const r=await fetch(`${API}/${id}`,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('Gagal download');const j=await r.json();return j.data;}
async function cloudPut(id,blob){const r=await fetch(`${API}/${id}`,{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({data:blob})});if(!r.ok)throw new Error('Gagal sync');}

// FUNGSI INI SUDAH DIPERBAIKI UNTUK PENYIMPANAN PERMANEN
async function saveAndSync(showOk=true){try{
  // 1. Selalu Pack dan Simpan ke Lokal (LocalStorage) - INI KUNCI PERMANENSI LOKAL
  const blob=await cryptoMgr.pack(credentials);
  localStorage.setItem(CACHE_KEY,blob);
  
  // 2. Jika ada Vault ID, sinkronkan ke Cloud
  if(vaultId){
    setSyncStatus('syncing','Menyinkronkan...');
    await cloudPut(vaultId,blob);
    setSyncStatus('online','Tersinkron');
    if(showOk)showToast('Tersinkron','Data berhasil disinkronkan ke cloud.');
  }else{
    setSyncStatus('online','Online (Lokal)');
    if(showOk)showToast('Tersimpan','Data tersimpan secara lokal di perangkat ini.');
  }
}catch(e){
  setSyncStatus('offline','Gagal sync');
  if(showOk)showToast('Peringatan Sync','Data tersimpan lokal, namun gagal sync ke cloud: '+e.message,true);
}}

/* ============ LOCK ============ */
function setMode(m){lockMode=m;document.querySelectorAll('.mode-tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===m));document.getElementById('syncBox').style.display=(m==='sync')?'block':'none';clearPin();const ti=document.getElementById('lockTitle'),su=document.getElementById('lockSub'),hi=document.getElementById('lockHint');if(m==='create'){ti.textContent='BUAT VAULT BARU';su.textContent='Buat PIN 4 digit untuk vault baru';hi.innerHTML='PIN = kunci enkripsi + akses. <strong>Jangan lupa</strong> — tanpa PIN data tak bisa dibuka.';}else if(m==='sync'){ti.textContent='SYNC PERANGKAT';su.textContent='Tempel Vault ID + masukkan PIN';hi.innerHTML='Salin <strong>Vault ID</strong> (ikon awan di header) di perangkat lain, tempel sini + PIN yang sama.';}else{ti.textContent='VAULT TERKUNCI';su.textContent='Masukkan PIN Keamanan';hi.innerHTML=vaultId?'':'Belum ada vault. Pilih <strong>Vault Baru</strong> atau <strong>Sync Perangkat</strong>.';}}
document.querySelectorAll('.mode-tab').forEach(t=>t.addEventListener('click',()=>setMode(t.dataset.mode)));
function pressPin(n){if(pendingPin.length<4){pendingPin+=n;updatePinDots();if(pendingPin.length===4)setTimeout(checkPin,120);}}
function clearPin(){pendingPin='';updatePinDots();document.getElementById('pinError').textContent='';}
function updatePinDots(){document.querySelectorAll('.pin-dot').forEach((d,i)=>d.classList.toggle('filled',i<pendingPin.length));}

// LOGIKA BUKA VAULT INI SUDAH DI-UPGRADE UNTUK PENGAMBILAN DATA YANG LEBIH BAIK
async function checkPin(){if(pendingPin.length!==4)return;const pin=pendingPin;try{
  if(lockMode==='create'){if(!confirmPin){confirmPin=pin;clearPin();const e=document.getElementById('pinError');e.style.color='var(--accent-cyan)';e.textContent='Konfirmasi PIN yang sama';return;}if(confirmPin!==pin){const e=document.getElementById('pinError');e.style.color='var(--accent-pink)';e.textContent='❌ PIN tidak cocok!';confirmPin=null;setTimeout(clearPin,800);return;}document.getElementById('pinError').style.color='';await cryptoMgr.deriveKey(pin);credentials=[];await saveAndSync(false);if(!vaultId){const blob=await cryptoMgr.pack(credentials);vaultId=await cloudCreate(blob);localStorage.setItem(ID_KEY,vaultId);localStorage.setItem(CACHE_KEY,blob);}showToast('Vault Dibuat','Vault baru dibuat & disinkronkan.');unlockVault();confirmPin=null;return;}
  if(lockMode==='sync'){const sid=document.getElementById('syncIdInput').value.trim();if(!sid){document.getElementById('pinError').textContent='❌ Masukkan Vault ID!';return;}await cryptoMgr.deriveKey(pin);setSyncStatus('syncing','Mengunduh vault...');const blob=await cloudGet(sid);credentials=await cryptoMgr.unpack(blob);vaultId=sid;localStorage.setItem(ID_KEY,vaultId);localStorage.setItem(CACHE_KEY,blob);showToast('Tersinkron','Vault dimuat dari perangkat lain!');unlockVault();return;}
  
  // LOGIKA LOGIN BIASA (DITINGKATKAN)
  const cached=localStorage.getItem(CACHE_KEY);
  if(!cached && !vaultId){document.getElementById('pinError').textContent='❌ Belum ada vault. Pilih Vault Baru.';setTimeout(clearPin,1200);return;}
  
  await cryptoMgr.deriveKey(pin); // Turunkan kunci dari PIN
  
  // 1. Prioritas 1: Muat dari Cache Lokal (LocalStorage) - CEPAT & PERMANEN
  let currentBlob = cached;
  let localDataLoaded = false;
  if(currentBlob){
    try {
      credentials = await cryptoMgr.unpack(currentBlob);
      localDataLoaded = true;
      // Langsung buka vault dengan data lokal agar terasa cepat
      unlockVault();
    } catch(e) {
      console.error("Gagal memuat cache lokal:", e);
      // Jika gagal, currentBlob tetap apa adanya untuk dicoba nanti
    }
  }

  // 2. Prioritas 2: Muat dari Cloud (jika ada) - UNTUK SINKRONISASI
  if(vaultId){
    try{
      // Beritahu pengguna aplikasi sedang mencoba sinkronisasi
      setSyncStatus('syncing','Memeriksa sinkronisasi...');
      const cloudBlob=await cloudGet(vaultId);
      
      // Jika data cloud berbeda dari lokal, perbarui
      if(cloudBlob !== currentBlob){
        const cloudCredentials = await cryptoMgr.unpack(cloudBlob);
        
        // Skenario gabungan (sederhana): Gunakan data cloud karena dianggap paling valid.
        // Implementasi yang lebih kompleks mungkin perlu membandingkan timestamp setiap kredensial.
        credentials = cloudCredentials;
        
        // Perbarui cache lokal agar permanen
        localStorage.setItem(CACHE_KEY, cloudBlob);
        
        // Jika belum dibuka, buka vault. Jika sudah terbuka (dari lokal), render ulang data.
        if(!isUnlocked){
          unlockVault();
        } else {
          updateStats();
          renderCredentials();
          setSyncStatus('online','Tersinkron (Latar Belakang)');
        }
      } else {
        setSyncStatus('online','Tersinkron (Sama dengan Cloud)');
      }
    }catch(e){
      // Jika gagal sync ke cloud (offline), tetap gunakan data lokal yang sudah dimuat
      console.error("Gagal sinkronisasi cloud:", e);
      if(localDataLoaded){
        setSyncStatus('offline','Mode Offline (Gagal Sync)');
        showToast('Mode Offline','Gagal sinkronisasi ke cloud, menggunakan data lokal.', true);
      } else {
        // Benar-benar tidak ada data lokal dan cloud gagal
        throw new Error('Tidak ada data lokal dan cloud gagal dimuat.');
      }
    }
  } else if (!localDataLoaded) {
    // Tidak ada Vault ID dan Cache Lokal Kosong
    throw new Error('Tidak ada data ditemukan.');
  }
  
}catch(e){document.getElementById('pinError').textContent=`❌ ${e.message||'PIN salah atau gagal memuat data!'}`;setTimeout(clearPin,800);}}

function unlockVault(){playUnlockSound();const ls=document.getElementById('lockScreen');ls.style.opacity='0';setTimeout(()=>ls.style.display='none',500);isUnlocked=true;updateVaultIdChip();updateStats();renderCredentials();resetSessionTimer();updateNetworkStatus();clearPin();}
function lockVault(){if(isLocking)return;isLocking=true;clearInterval(sessionTimer);const ls=document.getElementById('lockScreen');ls.style.display='flex';setTimeout(()=>ls.style.opacity='1',10);isUnlocked=false;visiblePasswords={};credentials=[];cryptoMgr.key=null;confirmPin=null;setMode('unlock');showToast('Terkunci','Vault berhasil dikunci.');setTimeout(()=>isLocking=false,1000);}
/* ============ TIMER ============ */
const RING_LEN=2*Math.PI*7;
function resetSessionTimer(){clearInterval(sessionTimer);sessionTime=300;updateTimerDisplay();sessionTimer=setInterval(()=>{sessionTime--;updateTimerDisplay();if(sessionTime<=0){clearInterval(sessionTimer);lockVault();showToast('Sesi Berakhir','Vault otomatis terkunci.',true);}},1000);}
function updateTimerDisplay(){const m=Math.floor(sessionTime/60),s=sessionTime%60;document.getElementById('timerDisplay').textContent=`${m}:${s.toString().padStart(2,'0')}`;const ring=document.getElementById('timerRing');if(ring){const off=RING_LEN*(1-sessionTime/300);ring.setAttribute('stroke-dashoffset',off);if(sessionTime<=60)ring.style.stroke='var(--accent-pink)';else ring.style.stroke='var(--accent-cyan)';}}
/* ============ TOAST ============ */
function showToast(title,msg,err=false){const t=document.getElementById('toast'),ic=document.getElementById('toastIcon');document.getElementById('toastTitle').innerText=title;document.getElementById('toastMessage').innerText=msg;if(err){t.style.borderColor='var(--accent-pink)';ic.className='fas fa-exclamation-circle';ic.style.color='var(--accent-pink)';}else{t.style.borderColor='var(--accent-cyan)';ic.className='fas fa-check-circle';ic.style.color='var(--accent-cyan)';}t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
/* ============ GEN & STRENGTH ============ */
function generatePassword(){const ch="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";const a=new Uint32Array(16);crypto.getRandomValues(a);let p='';for(let i=0;i<16;i++)p+=ch.charAt(a[i]%ch.length);const i=document.getElementById('passInput');i.value=p;i.type='text';document.getElementById('genEye').className='fas fa-eye-slash';checkPasswordStrength(p);showToast('Password Generated','Password kuat acak berhasil dibuat.');}
function toggleGenEye(){const i=document.getElementById('passInput'),e=document.getElementById('genEye');if(i.type==='password'){i.type='text';e.className='fas fa-eye-slash';}else{i.type='password';e.className='fas fa-eye';}}
function checkPasswordStrength(pw){const bar=document.getElementById('strengthBar'),txt=document.getElementById('strengthText');if(!pw){bar.style.width='0%';txt.textContent='';return;}let s=0;if(pw.length>=8)s++;if(pw.length>=12)s++;if(/[A-Z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;if(s<=2){bar.style.width='33%';bar.style.backgroundColor='var(--accent-pink)';txt.textContent='Lemah';}else if(s<=4){bar.style.width='66%';bar.style.backgroundColor='var(--accent-gold)';txt.textContent='Sedang';}else{bar.style.width='100%';bar.style.backgroundColor='var(--accent-cyan)';txt.textContent='Kuat';}}
/* ============ CREDENTIALS ============ */
document.getElementById('vaultForm').addEventListener('submit',async(e)=>{e.preventDefault();const p=document.getElementById('platformInput'),u=document.getElementById('userInput'),w=document.getElementById('passInput');credentials.push({id:Date.now(),p:p.value,u:u.value,w:w.value});p.value='';u.value='';w.value='';checkPasswordStrength('');updateStats();renderCredentials();resetSessionTimer();await saveAndSync();});
async function deleteCredential(id){if(!confirm('Hapus kredensial ini?'))return;credentials=credentials.filter(c=>c.id!==id);updateStats();renderCredentials();resetSessionTimer();await saveAndSync();}
function copyToClipboard(t,m){navigator.clipboard.writeText(t);showToast('Disalin',`${m} disalin ke clipboard.`);resetSessionTimer();}
function togglePasswordVisible(id){visiblePasswords[id]=!visiblePasswords[id];renderCredentials();resetSessionTimer();}
function getPlatformIcon(p){const pl=p.toLowerCase();if(pl.includes('google'))return 'fab fa-google';if(pl.includes('steam'))return 'fab fa-steam';if(pl.includes('microsoft'))return 'fab fa-microsoft';if(pl.includes('github'))return 'fab fa-github';if(pl.includes('apple'))return 'fab fa-apple';if(pl.includes('twitter')||pl.includes('x.'))return 'fab fa-x-twitter';if(pl.includes('facebook'))return 'fab fa-facebook';if(pl.includes('bank'))return 'fas fa-landmark';return 'fas fa-globe';}
function renderCredentials(f=''){const list=document.getElementById('credentialList');const search=f.toLowerCase();const filtered=credentials.filter(c=>c.p.toLowerCase().includes(search)||c.u.toLowerCase().includes(search)).sort((a,b)=>b.id-a.id);if(filtered.length===0){list.innerHTML=`<div class="empty-state"><i class="fas fa-search"></i>${credentials.length>0?'Tidak ada yang cocok.':'Vault kosong. Tambahkan kredensial pertama Anda.'}</div>`;return;}list.innerHTML='';filtered.forEach(c=>{const pwVisible=visiblePasswords[c.id];const row=document.createElement('div');row.className='credential-item';row.innerHTML=`<div class="platform-col"><div class="platform-icon-wrapper"><i class="${getPlatformIcon(c.p)}"></i></div>${c.p}</div><div class="user-col"><i class="fas fa-at"></i> ${c.u}</div><div class="pass-col">${pwVisible?c.w:'•••••••••••'}</div><div class="action-col"><button class="action-btn" onclick="togglePasswordVisible(${c.id})" title="Lihat/Sembunyikan"><i class="fas fa-${pwVisible?'eye-slash':'eye'}"></i></button><button class="action-btn" onclick="copyToClipboard('${c.u}','Username')" title="Salin Username"><i class="fas fa-user"></i></button><button class="action-btn" onclick="copyToClipboard('${c.w}','Password')" title="Salin Password"><i class="fas fa-key"></i></button><button class="action-btn del" onclick="deleteCredential(${c.id})" title="Hapus"><i class="fas fa-trash-alt"></i></button></div>`;list.appendChild(row);});}
function filterCredentials(){const f=document.getElementById('searchInput').value;renderCredentials(f);}
function updateStats(){document.getElementById('totalCount').innerText=credentials.length;}
/* ============ MANAGEMENT ============ */
async function syncNow(){resetSessionTimer();await saveAndSync(true);}
async function exportData(){if(!isUnlocked)return;try{const blob=await cryptoMgr.pack(credentials);const dataUrl=`data:application/json;base64,${blob}`;const link=document.createElement('a');link.href=dataUrl;link.download=`Phoenix_Vault_Backup_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(link);link.click();document.body.removeChild(link);showToast('Backup Berhasil','File backup JSON telah diunduh.');resetSessionTimer();}catch(e){showToast('Backup Gagal',e.message,true);}}
function importData(){document.getElementById('fileInput').click();}
async function handleImport(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=async(e)=>{try{const blob=e.target.result;credentials=await cryptoMgr.unpack(blob);updateStats();renderCredentials();showToast('Restore Berhasil','Data dari file backup dimuat!');resetSessionTimer();await saveAndSync();}catch(e){showToast('Restore Gagal','PIN salah atau file korup.',true);}};reader.readAsText(file);event.target.value='';}
async function changePin(){const newPin=prompt('Masukkan PIN 4-digit baru:');if(!newPin||newPin.length!==4||!/^\d+$/.test(newPin)){alert('PIN tidak valid (harus 4 digit angka).');return;}const confirmNew=prompt('Konfirmasi PIN baru:');if(newPin!==confirmNew){alert('Konfirmasi PIN tidak cocok.');return;}try{cryptoMgr.deriveKey(newPin);await saveAndSync(false);showToast('PIN Diganti','PIN berhasil diubah dan vault disinkronkan.');resetSessionTimer();}catch(e){showToast('Gagal Ganti PIN',e.message,true);}}
async function clearAllData(){if(!confirm('⚠️ PERINGATAN: Ini akan menghapus SEMUA data secara permanen di perangkat & cloud. Lanjutkan?'))return;try{if(vaultId){setSyncStatus('syncing','Menghapus cloud...');await fetch(`${API}/${vaultId}`,{method:'DELETE'});}localStorage.removeItem(ID_KEY);localStorage.removeItem(CACHE_KEY);credentials=[];vaultId=null;lockVault();showToast('Vault Dihapus','Semua data telah dibersihkan.',true);}catch(e){showToast('Hapus Gagal',e.message,true);setSyncStatus('offline','Hapus gagal');}}
/* ============ UTILS ============ */
function updateVaultIdChip(){document.getElementById('vaultIdText').innerText=vaultId?vaultId.slice(0,8)+'...':'Lokal Only';document.getElementById('vaultIdChip').title=vaultId?`Klik untuk salin Vault ID: ${vaultId}`:'Belum tersinkron ke cloud. Klik Sinkronisasi Data untuk membuat Vault ID.';}
document.getElementById('vaultIdChip').addEventListener('click',()=>{if(vaultId)copyToClipboard(vaultId,'Vault ID');});
window.addEventListener('online',updateNetworkStatus);window.addEventListener('offline',updateNetworkStatus);
/* ============ INIT ============ */
setMode('unlock');updateNetworkStatus();
</script>
